server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # No cap here — the backend has no per-file size limit either; a user's
    # storage quota is the only real ceiling on an upload.
    client_max_body_size 0;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1024;

    # SSE real-time sync — must come before the generic /api/ block
    location /api/events {
        proxy_pass http://backend:3001/api/events;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        chunked_transfer_encoding on;
    }

    # MCP endpoint for external AI agents (Streamable HTTP). Buffering is off so
    # streamed JSON-RPC / SSE responses are forwarded without delay.
    location /mcp {
        proxy_pass http://backend:3001/mcp;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        chunked_transfer_encoding on;
    }

    # OAuth discovery documents for the Claude MCP connector. Must reach the
    # backend rather than the SPA fallback. Scoped to the oauth- prefix so it
    # never shadows ACME (/.well-known/acme-challenge) or other well-known URIs.
    location /.well-known/oauth- {
        proxy_pass http://backend:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # CalDAV server (Apple Calendar / Thunderbird / … sync). All WebDAV methods
    # (PROPFIND, REPORT, PUT, DELETE, …) are proxied to the backend; this must
    # bypass the SPA fallback.
    location /caldav {
        proxy_pass http://backend:3001/caldav;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_request_buffering off;
    }

    # CalDAV service discovery (clients probe this, then follow the redirect).
    location = /.well-known/caldav {
        proxy_pass http://backend:3001/.well-known/caldav;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy API requests to backend
    location /api/ {
        proxy_pass http://backend:3001/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_no_cache 1;
        proxy_hide_header ETag;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_request_buffering off;
    }

    # Static assets with long cache
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Web App Manifest (Home Screen install) — unlike hashed JS/CSS bundles its
    # filename never changes across deploys, so it gets a short cache instead
    # of the long-cache-immutable rule above, plus the correct content type
    # (nginx's default mime.types doesn't know this extension).
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        expires 1h;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # SPA fallback — all other routes serve index.html
    #
    # Content-Security-Policy is set here (the edge that actually serves the
    # HTML document the browser renders) rather than on the backend's JSON API
    # responses, which are never rendered as HTML and so never "protected" by
    # a CSP header in the first place. This is defense-in-depth against the
    # class of XSS the S1 Leaflet-popup fix (buildPoiPopupElement) closes at
    # the code level: even a future string-built-HTML mistake elsewhere can't
    # run injected <script>/event-handler markup or exfiltrate via a foreign
    # origin. Directives are scoped to what this SPA actually needs, verified
    # against source: 'unsafe-inline' on style-src is required because nearly
    # every component uses inline style={{}} (CLAUDE.md's documented styling
    # convention — removing it would be an app-wide rewrite, out of scope
    # here); img-src additionally allow-lists the two Leaflet basemap tile
    # hosts (CARTO, ArcGIS) the GPS screens load directly; connect-src
    # allow-lists Nominatim (the address-search box queries it directly from
    # the browser) and Overpass (overpass-api.de — GPSEditScreen's surface-
    # breakdown widget, utils/surfaceData.ts, calls it directly from the
    # browser too). POI search's OWN Overpass usage (routes/gps.ts's /pois)
    # IS proxied server-side and never touches the browser's own fetch — that
    # part of the original comment here was accurate, but surfaceData.ts's
    # separate direct call was not, and was silently broken by this CSP until
    # this allowlist entry was added; Valhalla routing/snapping remains
    # server-side only, with no browser-side call anywhere.
    location / {
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://*.basemaps.cartocdn.com https://server.arcgisonline.com; connect-src 'self' https://nominatim.openstreetmap.org https://overpass-api.de; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        try_files $uri $uri/ /index.html;
    }
}
