services:
  todo-list:
    build: .
    ports:
      - "9123:9123"
    environment:
      - DATABASE_URL=file:/app/data/dev.db
      - APP_PASSWORD=${APP_PASSWORD:-changeme}
      - JWT_SECRET=${JWT_SECRET:-please-change-me-in-production}
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9123/api/todo"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: always

volumes:
  data:
