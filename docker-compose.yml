version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: solytiq-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-solytiq}
      POSTGRES_USER: ${POSTGRES_USER:-solytiq}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-solytiq_secret}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-solytiq} -d ${POSTGRES_DB:-solytiq}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - solytiq-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: solytiq-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB:-solytiq}
      PGUSER: ${POSTGRES_USER:-solytiq}
      PGPASSWORD: ${POSTGRES_PASSWORD:-solytiq_secret}
      JWT_SECRET: ${JWT_SECRET:-change_this_secret_in_production}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - solytiq-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3001/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api
    container_name: solytiq-frontend
    restart: unless-stopped
    ports:
      - "${PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - solytiq-net

volumes:
  postgres_data:

networks:
  solytiq-net:
    driver: bridge
